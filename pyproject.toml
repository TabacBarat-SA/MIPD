[project]
name = "cliente360"
version = "1.0.0"
description = "Laboratorio Cliente 360: CLV, recomendacion y segmentacion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.5,<2",
    "pyarrow>=16",
    "streamlit>=1.53,<2",
    "plotly>=5.24,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "matplotlib>=3.8,<4",
    "tabulate>=0.9,<1",
    "torch==2.9.1",
    "forex-python>=1.9.2",
]
[tool.uv.sources]
torch = [{index="pytorch-cu128", marker="sys_platform == 'win32' or sys_platform == 'linux'"}]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
